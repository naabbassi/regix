# Releases a version, in this order:
#
#   1. release  creates the git tag (if it is new) and the GitHub release
#   2. test     runs the tests on the tagged commit
#   3. image    builds the container image from the tagged commit and pushes it to Docker Hub
#
# Started by hand: Actions > Release > Run workflow, and enter the tag, e.g. 1.2.3.
#
# The image gets exactly the tag you enter: 1.2.3 publishes amanj/regix:1.2.3 and nothing else,
# except amanj/regix:latest when "Also tag as latest" is ticked (never for a pre-release such as
# 1.2.3-rc.1).
#
#   - If the tag exists, that tagged commit is released.
#   - If it does not, the tag is created at the head of the branch the workflow is run from.
#   - If a later step fails, fix the cause and run the workflow again with the same tag: the
#     release is kept and the remaining steps are repeated.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME   a Docker Hub account that may push to amanj/regix
#   DOCKERHUB_TOKEN      an access token of that account with Read & Write scope
name: Release

run-name: Release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. 1.2.3. The image is published under exactly this tag.
        required: true
        type: string
      latest:
        description: Also tag the image as latest
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: amanj/regix

jobs:
  release:
    name: Create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the tag and the release
    outputs:
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all history and tags, for the release notes

      - name: Create the tag and the GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # The tag names both a git tag and an image tag, so it must be valid as either.
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$ ]] || [[ "$TAG" == *..* || "$TAG" == *. || "$TAG" == *.lock ]]; then
            echo "::error::\"$TAG\" cannot be used as a tag. Use letters, digits, dots, dashes and underscores, e.g. 1.2.3."
            exit 1
          fi
          if [ "$TAG" = latest ]; then
            echo "::error::\"latest\" is not a version. Enter the version and tick \"Also tag as latest\"."
            exit 1
          fi

          # A version with a suffix (1.2.3-rc.1) is a pre-release.
          prerelease=
          if [[ "$TAG" == *-* ]]; then prerelease=true; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

          chart=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' deploy/helm/regix/Chart.yaml)
          if [ "$chart" != "$TAG" ]; then
            echo "::warning::The Helm chart's appVersion is $chart, so it deploys $IMAGE:$chart by default, not $TAG. Update deploy/helm/regix/Chart.yaml."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; continuing with its tests and image."
            exit 0
          fi

          notes=$(mktemp)
          printf 'Container image:\n\n```\ndocker pull %s:%s\n```\n' "$IMAGE" "$TAG" > "$notes"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Creating the release for the existing tag $TAG."
            target=(--verify-tag)
          else
            echo "Creating tag $TAG at $(git rev-parse --short HEAD) and its release."
            target=(--target "$(git rev-parse HEAD)")
          fi
          gh release create "$TAG" "${target[@]}" --title "$TAG" --notes-file "$notes" --generate-notes \
            ${prerelease:+--prerelease}

  test:
    name: Test
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    name: Build and push the image
    needs: [release, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Choose the image tags
        id: tags
        env:
          TAG: ${{ inputs.tag }}
          LATEST: ${{ inputs.latest && needs.release.outputs.prerelease != 'true' }}
        run: |
          tags="$IMAGE:$TAG"
          if [ "$LATEST" = true ]; then tags+=",$IMAGE:latest"; fi
          echo "Publishing $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.version=${{ inputs.tag }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
