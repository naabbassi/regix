# my-values.yaml
ui:
  image:
    repository: registry.medident-trade.com/dashboard
    tag: "1.0.0"
  ingress:
    enabled: true
    className: traefik
    host: regix.medident-trade.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  protectedTags: [latest]

registry:
  persistence:
    size: 20Gi
    storageClass: hcloud-volumes
  ingress:
    enabled: true
    className: traefik
    host: registry.medident-trade.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod