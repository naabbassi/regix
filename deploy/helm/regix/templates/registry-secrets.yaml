{{- if .Values.registry.enabled }}
{{- $name := include "regix.registry.name" . }}
{{- /* The secret that signs upload sessions has to stay the same across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-http" $name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-http
  labels:
    {{- include "regix.labels" (dict "root" . "component" "registry") | nindent 4 }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "http-secret") }}
  http-secret: {{ index $existing.data "http-secret" }}
  {{- else }}
  http-secret: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- if and .Values.registry.auth.enabled (not .Values.registry.auth.existingSecret) }}
{{- if not .Values.registry.auth.users }}
{{- fail "The registry requires a login: set registry.auth.users (or registry.auth.existingSecret), or switch it off with registry.auth.enabled=false." }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-auth
  labels:
    {{- include "regix.labels" (dict "root" . "component" "registry") | nindent 4 }}
type: Opaque
stringData:
  # The hashes are salted anew at every upgrade; the passwords they accept stay the same. The
  # registry re-reads this file when it changes, so no restart is needed.
  htpasswd: |
    {{- range .Values.registry.auth.users }}
    {{ htpasswd (required "every entry of registry.auth.users needs a username" .username) (required "every entry of registry.auth.users needs a password" .password) }}
    {{- end }}
{{- end }}
{{- end }}
